# Gujarat Police CCTV Intelligence — dashboard reverse proxy.
#
# Serves the static SPA and proxies the API + realtime WebSocket to the
# backend container. The browser only ever talks to this origin (no CORS,
# no backend URL in the bundle). RTSP URLs never flow to the browser.
#
# nginx includes files in conf.d/*.conf at the http context, so the upstream,
# map and server blocks here are all valid.

upstream gp_backend {
    server backend:8000;
}

# WebSocket connection-upgrade map (http context).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Security headers (the backend also sets these on API responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    client_max_body_size 12m;

    root /usr/share/nginx/html;
    index index.html;

    # --- API ---------------------------------------------------------------- #
    location /api/ {
        proxy_pass http://gp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /api/ws.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-lived streams / MJPEG.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://gp_backend/health;
    }

    # --- Static SPA (client-side routing) ----------------------------------- #
    location / {
        try_files $uri $uri/ /index.html;
    }
}
